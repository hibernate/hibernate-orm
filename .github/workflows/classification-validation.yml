name: Classification and migration validation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: { }

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.ref }}"
  cancel-in-progress: true

env:
  COMMON_GRADLE_ARGS: "-Igradle/init.gradle"
  MIRROR_MAVEN_CENTRAL_URL: "https://maven-central.storage-download.googleapis.com/maven2/"
  MIRROR_MAVEN_CENTRAL_FALLBACK: "true"

jobs:
  validate:
    name: Advisory classification and compatibility validation
    if: github.repository == 'hibernate/hibernate-orm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Run advisory validation
        shell: bash
        run: |
          set +e
          read -ra common_gradle_args <<< "$COMMON_GRADLE_ARGS"

          ./gradlew "${common_gradle_args[@]}" :documentation:validateClassifications
          classification_status=$?

          ./gradlew "${common_gradle_args[@]}" :documentation:validateSpi -x :documentation:validateClassifications
          spi_status=$?

          ./gradlew "${common_gradle_args[@]}" :documentation:validateDialectProviderBoundaries -x :documentation:validateClassifications
          provider_status=$?

          ./gradlew "${common_gradle_args[@]}" :documentation:validateMigrationCompatibility
          migration_status=$?

          result() {
            if [[ "$1" -eq 0 ]]; then
              echo "PASSED"
            else
              echo "FAILED ($1)"
            fi
          }

          {
            echo "## Advisory classification and compatibility validation"
            echo
            echo "This scheduled workflow reports the reviewed migration backlog; it is not yet a blocking gate."
            echo
            echo "| Task | Exit status |"
            echo "| --- | ---: |"
            echo "| validateClassifications | $(result "$classification_status") |"
            echo "| validateSpi | $(result "$spi_status") |"
            echo "| validateDialectProviderBoundaries | $(result "$provider_status") |"
            echo "| validateMigrationCompatibility | $(result "$migration_status") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: classification-and-migration-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            documentation/target/orm/reports/classifications.json
            documentation/target/orm/reports/classifications.json.gz
            documentation/target/orm/reports/*validation*.txt
            documentation/target/orm/reports/*validation*.json
