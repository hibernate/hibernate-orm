import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id "local.publishing-java-module"
    id "local.publishing-group-relocation"

    alias(libs.plugins.versionInjection)
    alias(libs.plugins.hibernateBuildAntlr)
    alias(libs.plugins.hibernateXjc)
    id "me.champeau.jmh" version "0.7.2"
}

description = 'Hibernate\'s core ORM functionality'

configurations {
    tests {
        description = 'Configuration for the produced test jar'
    }
}

tasks.named("forbiddenApisJmh") {
    enabled = false
}

dependencies {
    api libs.jakarta.jpa
    api libs.jakarta.jta

    implementation libs.hibernateModels
    implementation libs.hibernateAccessorByteBuddy
    implementation libs.byteBuddy

    implementation libs.jakarta.jaxbApi
    implementation libs.jakarta.jaxb
    implementation libs.jakarta.inject

    implementation libs.antlrRuntime

    compileOnly libs.jakarta.jacc
    compileOnly libs.jakarta.validation
    compileOnly libs.jakarta.cdi
    compileOnly libs.jakarta.data
    compileOnly libs.jakarta.jsonbApi
    compileOnly libs.jackson
    compileOnly libs.jacksonXml
    compileOnly libs.jackson3
    compileOnly libs.jackson3Xml
    compileOnly libs.jdbc.postgresql
    compileOnly libs.jdbc.edb

    testImplementation project(':hibernate-testing')
    testImplementation project(':hibernate-ant')
    testImplementation project(':hibernate-scan-jandex')

    // todo : to get rid of these
    testImplementation libs.test.junit4
    testImplementation libs.test.junit4Engine

    testImplementation libs.test.shrinkwrap
    testImplementation libs.test.shrinkwrapDescriptors
    testImplementation libs.jakarta.cdi
    testImplementation libs.jakarta.data
    testImplementation libs.jakarta.jacc
    testImplementation libs.jakarta.validation
    testImplementation( libs.test.validator ) {
        // for test runtime
        transitive = true
    }
    testImplementation libs.jdbc.h2
    testImplementation libs.hibernateModelsJandex

    testRuntimeOnly libs.byteBuddy
    testRuntimeOnly libs.test.weld
    implementation libs.logging
    testRuntimeOnly(libs.test.wildFlyTxnClient) {
        // WildFly Elytron includes a whole copy of JBoss Logging, Jackson with its original package,
        // not even shaded, which causes lots of problems.
        // Since we don't need WildFly Elytron in our tests, we'll just exclude it.
        exclude group: 'org.wildfly.security', module: 'wildfly-elytron'
    }
    testImplementation libs.jandex
    testImplementation libs.jakarta.jsonb
    testImplementation libs.jackson
    testRuntimeOnly libs.jacksonXml
    testRuntimeOnly libs.jacksonJsr310
    testImplementation libs.jackson3
    testImplementation libs.jackson3Xml

    testAnnotationProcessor project( ':hibernate-processor' )

    // NOTE: it seems like, since 4.10, the Antlr Tool no longer defines
    // transitive dep on the corresponding Antlr Runtime.  At least, I get
    // errors about mismatched versions if I do not include the runtime
    // dependency here.
    antlr libs.antlr
	antlr libs.antlrRuntime

	// JMH benchmarks
	jmh libs.jdbc.h2
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.hibernate.Version'
        )
    }
}

ext {
    jaxbTargetDir = project.layout.buildDirectory.dir("generated/sources/xjc/main").get().asFile
}

sourceSets {
    instrumentationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test {
        resources {
            srcDir 'src/test/resources'
            srcDir 'src/test/bundles'
        }
    }
}

dependencies {
    instrumentationTestImplementation libs.test.junitJupiterApi
    instrumentationTestRuntimeOnly libs.test.junitJupiterEngine
    instrumentationTestRuntimeOnly libs.test.junitJupiterLauncher
}

def instrumentationTestAgent = tasks.register('instrumentationTestAgent', Jar) {
    archiveClassifier = 'instrumentation-test-agent'
    from sourceSets.instrumentationTest.output
    include 'org/hibernate/orm/test/instrumentation/InstrumentationAgent.class'
    manifest {
        attributes 'Premain-Class': 'org.hibernate.orm.test.instrumentation.InstrumentationAgent'
    }
}

def instrumentationTest = tasks.register('instrumentationTest', Test) {
    description = 'Tests load-time enhancement in a fresh JVM with a startup agent.'
    group = 'verification'
    dependsOn instrumentationTestAgent
    testClassesDirs = sourceSets.instrumentationTest.output.classesDirs
    classpath = sourceSets.instrumentationTest.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
    doFirst {
        jvmArgs "-javaagent:${instrumentationTestAgent.get().archiveFile.get().asFile.absolutePath}"
    }
}

tasks.named('check') {
    dependsOn instrumentationTest
}

jmh {
    jmhVersion = '1.37'
    warmupIterations = 5
    iterations = 10
    fork = project.hasProperty( 'jmh.fork' ) ? project.property( 'jmh.fork' ) as int : 1
    zip64 = true

    // Force JMH to use minimal logging configuration from src/jmh/resources
    // Without this, it picks up src/test/resources/log4j2.properties with TRACE logging
    // which generates millions of log lines and severely degrades benchmark performance
    jvmArgs = ['-Dlog4j.configurationFile=file:src/jmh/resources/log4j2.properties']

    // Can be overridden via -Pjmh.include="pattern"
    if (project.hasProperty('jmh.include')) {
        includes = [project.property('jmh.include')]
    }

    // JFR profiler support - can be enabled via -Pjmh.profiler=true
    if (project.hasProperty('jmh.profiler')) {
        profilers = ['jfr']
    }
}

xjc {
    outputDirectory = project.jaxbTargetDir

    schemas {
        cfg {
            xsdFile = 'src/main/resources/org/hibernate/xsd/cfg/legacy-configuration-4.0.xsd'
            xjcBindingFile = 'src/main/xjb/hbm-configuration-bindings.xjb'
        }
        hbm {
            xsdFile = file( 'src/main/resources/org/hibernate/xsd/mapping/legacy-mapping-4.0.xsd' )
            xjcBindingFile = file( 'src/main/xjb/hbm-mapping-bindings.xjb' )
            xjcPlugins('inheritance', 'simplify')
        }
        configuration {
            xsdFile = file( 'src/main/resources/org/hibernate/xsd/cfg/configuration-8.0.xsd' )
            xjcBindingFile = file( 'src/main/xjb/configuration-bindings.xjb' )
            xjcPlugins('inheritance', 'simplify')
        }
        mapping {
            xsdFile = file( 'src/main/resources/org/hibernate/xsd/mapping/mapping-8.0.xsd' )
            xjcBindingFile = file( 'src/main/xjb/mapping-bindings.xjb' )
            xjcPlugins('inheritance', 'simplify')
        }
    }
}

versionInjection {
    into( 'org.hibernate.Version', 'initVersion' )
}

tasks.register('copyBundleResourcesXml', Copy) {
    inputs.property( "db", db )
    inputs.property( "dbHost", dbHost )
    ext {
        bundlesTargetDir = layout.buildDirectory.dir("bundles").get().asFile
        // Escape
        bundleTokens = [
                'db.dialect' : dbBundle[db]['db.dialect'].replace("&", "&amp;"),
                'jdbc.driver' : dbBundle[db]['jdbc.driver'].replace("&", "&amp;"),
                'jdbc.user' : dbBundle[db]['jdbc.user'].replace("&", "&amp;"),
                'jdbc.pass' : dbBundle[db]['jdbc.pass'].replace("&", "&amp;"),
                'jdbc.url' : dbBundle[db]['jdbc.url'].replace("&", "&amp;"),
                'jdbc.datasource' : dbBundle[db]['jdbc.datasource'].replace("&", "&amp;"),
                'connection.init_sql' : dbBundle[db]['connection.init_sql'].replace("&", "&amp;")
        ]
        ext.bundleTokens['buildDirName'] = project.relativePath( layout.buildDirectory.asFile.get() )
    }

    from('src/test/bundles/templates') {
        include '**/*.xml'
    }
    into ext.bundlesTargetDir
    filter( ReplaceTokens, tokens: ext.bundleTokens)

    doFirst {
        ext.bundlesTargetDir.mkdirs()
    }
}

tasks.register('copyBundleResourcesNonXml', Copy) {
    inputs.property( "db", db )
    ext {
        bundlesTargetDir = layout.buildDirectory.dir("bundles").get().asFile
        // Escape
        bundleTokens = dbBundle[db]
        ext.bundleTokens['buildDirName'] = project.relativePath(layout.buildDirectory.asFile.get())
    }

    from('src/test/bundles/templates') {
        exclude '**/*.xml'
    }
    into ext.bundlesTargetDir
    filter( ReplaceTokens, tokens: ext.bundleTokens)

    doFirst {
        ext.bundlesTargetDir.mkdirs()
    }
}

tasks.register('copyBundleResources', Copy) {
    inputs.property( "db", db )
    dependsOn tasks.copyBundleResourcesXml
    dependsOn tasks.copyBundleResourcesNonXml
}

processTestResources {
    dependsOn copyBundleResources
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('testJar', Jar) {
    dependsOn testClasses
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set( 'test' )
    from sourceSets.test.output
}

artifacts {
    tests testJar
}

compileTestJava {
    options.compilerArgs += [ "-AsuppressJakartaDataMetamodel=true" ]
}

tasks.register( "generateAnnotationClasses", JavaCompile ) {
    description = "Generate concrete classes for Hibernate and JPA annotations"

    source = sourceSets.main.allJava
    include "org/hibernate/annotations/*"
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    options.annotationProcessorPath = sourceSets.main.compileClasspath
    options.compilerArgs = [
            "-proc:only",
            "-processor",
            "org.hibernate.orm.build.annotations.ClassGeneratorProcessor"
    ]

    destinationDirectory.set( project.layout.buildDirectory.dir( "generated/sources/annotations/" ) )
}

tasks.register('generateEnversStaticMetamodel', JavaCompile) {
    description = "Generate the Hibernate Envers revision entity static metamodel classes."

    source = sourceSets.main.java
    // we only want to include these specific classes for metamodel generation.
    // if envers adds any additional revision entity classes, they must be listed here.
    include 'org/hibernate/envers/DefaultRevisionEntity.java'
    include 'org/hibernate/envers/DefaultTrackingModifiedEntitiesRevisionEntity.java'
    include 'org/hibernate/envers/enhanced/SequenceIdRevisionEntity.java'
    include 'org/hibernate/envers/enhanced/SequenceIdTrackingModifiedEntitiesRevisionEntity.java'

    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.compileClasspath
    options.compilerArgs = [
            "-proc:only",
            "-processor",
            "org.hibernate.processor.HibernateProcessor"
    ]

    // put static metamodel classes back out to the source tree since they're version controlled.
    destinationDirectory = layout.projectDirectory.dir("src/main/java").asFile
}

tasks.withType( Test.class ).configureEach { test ->
    test.systemProperty 'file.encoding', 'utf-8'
    // Allow creating a function in HSQLDB for this Java method
    test.systemProperty 'hsqldb.method_class_names', 'org.hibernate.orm.test.jpa.transaction.TransactionTimeoutTest.sleep'

    // See org.hibernate.boot.model.naming.NamingHelperTest.DefaultCharset.set
    test.jvmArgs( ['--add-opens', 'java.base/java.nio.charset=ALL-UNNAMED'] )
    // Weld needs this to generate proxies
    test.jvmArgs( ['--add-opens', 'java.base/java.security=ALL-UNNAMED'] )
    test.jvmArgs( ['--add-opens', 'java.base/java.lang=ALL-UNNAMED'] )

    //Avoid Log4J2 classloader leaks:
    test.jvmArgs( ['-Dlog4j2.disableJmx=true'] )

    // see GradleParallelTestingResolver for how the test worker id is resolved in JDBC configs
    def forks = org.hibernate.orm.env.TestParallelism.resolveThreadCount(
            project.db,
            project.findProperty("test.threads")?.toString()
    )
    if (forks.present) {
        test.maxParallelForks = forks.asInt
        test.systemProperty 'maxParallelForks', test.maxParallelForks
    }
    if (!forks.present || forks.asInt == 1) {
        // To reduce the JVM metaspace pressure, reduce the amount of classes that can run in one fork
        test.forkEvery = 8096
    }
}

instrumentationTest.configure {
    // Preserve cold Byte Buddy loading even if more instrumentation tests are added.
    forkEvery = 1
}

tasks.named( "javadoc", Javadoc ) {
    configure(options) {
        overview = rootProject.file( "shared/javadoc/overview.html" )
        exclude( "**/internal/**", "org/hibernate/boot/jaxb/**", "org/hibernate/tuple/**", "org/hibernate/grammars/hql/**" )
    }
}

tasks.sourcesJar.dependsOn ':hibernate-core:generateGraphParser'
tasks.sourcesJar.dependsOn ':hibernate-core:generateDeprecated-graphParser'
tasks.sourcesJar.dependsOn ':hibernate-core:generateHqlParser'
tasks.sourcesJar.dependsOn ':hibernate-core:generateSqlScriptParser'
tasks.sourcesJar.dependsOn ':hibernate-core:generateOrderingParser'
tasks.sourcesJar.dependsOn ':hibernate-core:generateSqlFormatterParser'

// Explicit environment axes for temporal preservation verification. Keep the
// normal UTC test default; these options also become Test task inputs.
tasks.named('test', Test) {
    def temporalJvmTimeZone = providers.gradleProperty('temporalTestJvmTimeZone')
    if (temporalJvmTimeZone.present) {
        java.time.ZoneId.of(temporalJvmTimeZone.get())
        systemProperty 'user.timezone', temporalJvmTimeZone.get()
        systemProperty 'hibernate.test.temporal.jvm_zone', temporalJvmTimeZone.get()
    }
    def temporalSessionTimeZone = providers.gradleProperty('temporalTestSessionTimeZone')
    if (temporalSessionTimeZone.present) {
        def zone = temporalSessionTimeZone.get()
        java.time.ZoneId.of(zone)
        def database = providers.gradleProperty('db').getOrElse('h2')
        def statement
        if (database in ['oracle', 'oracle_xe']) {
            statement = "alter session set time_zone='${zone}'"
        }
        else if (database in ['h2', 'postgresql', 'pgsql']) {
            statement = "set time zone '${zone}'"
        }
        else {
            throw new GradleException("Temporal session-timezone verification is not configured for ${database}")
        }
        systemProperty 'hibernate.connection.init_sql', statement
        systemProperty 'hibernate.test.temporal.session_zone', zone
    }
    ['Phase', 'Url'].each { option ->
        def temporalCrossOption = providers.gradleProperty("temporalTestCross${option}")
        if (temporalCrossOption.present) {
            systemProperty "hibernate.test.temporal.cross_${option.toLowerCase()}", temporalCrossOption.get()
        }
    }
    ['Writer', 'Reader'].each { phase ->
        def temporalPhaseTimeZone = providers.gradleProperty("temporalTest${phase}TimeZone")
        if (temporalPhaseTimeZone.present) {
            java.time.ZoneId.of(temporalPhaseTimeZone.get())
            systemProperty "hibernate.test.temporal.${phase.toLowerCase()}_zone", temporalPhaseTimeZone.get()
        }
    }
    def temporalJdbcTimeZone = providers.gradleProperty('temporalTestJdbcTimeZone')
    if (temporalJdbcTimeZone.present) {
        java.time.ZoneId.of(temporalJdbcTimeZone.get())
        systemProperty 'hibernate.jdbc.time_zone', temporalJdbcTimeZone.get()
    }
}

// Separate JVM entry point bypasses the JUnit launcher's schema cleaner so a reader
// can inspect rows committed by the preceding writer process.
tasks.register('temporalCrossEnvironment', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.hibernate.orm.test.mapping.javatime.redesign.TemporalCrossEnvironmentTests'
    doFirst {
        systemProperties tasks.test.systemProperties
    }
}

// Typed preservation matrix profiles include disconnected bootstrap and cross-process reads.
tasks.register('temporalPreservationMatrix', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.hibernate.orm.test.type.temporal.preservation.PreservationMatrixRunner'
    systemProperty 'log4j2.configurationFile', 'temporal-preservation-log4j2.properties'
    doFirst {
        systemProperties tasks.test.systemProperties
        ['Profile', 'Phase', 'Metadata', 'Url'].each { option ->
            def value = providers.gradleProperty("temporalMatrix${option}")
            if (value.present) systemProperty "hibernate.test.temporal.matrix_${option.toLowerCase()}", value.get()
        }
        def type = providers.gradleProperty('temporalMatrixType')
        if (type.present) args type.get()
    }
}
