plugins {
    id "local.java-module"
    id "local.code-quality"

    alias( libs.plugins.kotlin.jvm )
    alias( libs.plugins.kotlin.jpa )
}

description = 'Kotlin tests for Hibernate\'s core ORM functionality'

dependencies {
    testImplementation project( ':hibernate-testing' )
    testImplementation project( path: ':hibernate-core', configuration: 'tests' )
    testImplementation libs.test.assertjCore
}

kotlin {
    compilerOptions {
        // Tests are executed on JDK 17 in CI (see .github/workflows/ci.yml),
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
