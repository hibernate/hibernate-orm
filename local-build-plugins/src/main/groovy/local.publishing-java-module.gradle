plugins {
    id "local.java-module"
    id "local.publishing"
    id "local.code-quality"
}

configurations {
    javadocSources {
        description = "All Java sources for the project's Javadoc"
        canBeConsumed = true
        canBeResolved = false
        visible = false
    }
}

dependencies {
    javadocSources sourceSets.main.allJava
}


// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Javadoc

// Reduce the size of per-module javadoc jars published to Maven Central.
// These options are intentionally NOT in local.javadoc.gradle,
// so that the aggregated javadoc published to docs.hibernate.org is unaffected.
tasks.withType(Javadoc).configureEach {
    exclude '**/spi/**' // SPI pages are ~7M in the jar; SPI is for integrators who read the source
    configure( options ) {
        addStringOption('-override-methods', 'summary') // don't repeat inherited method docs; link to the declaring type instead
        use = false // class-use pages are ~10M in the jar; IDEs provide better "find usages"
        splitIndex = true // avoid a single 17M index-all.html; split into per-letter files instead
        noTree = true // class hierarchy is ~7M uncompressed; IDEs show this better
    }
}

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Publishing

var publishingExtension = project.getExtensions().getByType(PublishingExtension) as PublishingExtension
publishingExtension.publications.named("publishedArtifacts", MavenPublication) {
    // Add the Java component to the main publication
    from components.java
}


// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Releasing

def releasePrepareTask = tasks.register("releasePrepare") {
    group "release"
    description "See :release:releasePrepare for details.  Here we hook in testing and checks ensure publish-ability"

    dependsOn tasks.check
    dependsOn tasks.generateMetadataFileForPublishedArtifactsPublication
    dependsOn tasks.generatePomFileForPublishedArtifactsPublication
    // we depend on publishAllPublicationsToStagingRepository to make sure that the artifacts are "published" to a local staging directory
    // used by JReleaser during the release process
    dependsOn tasks.publishAllPublicationsToStagingRepository
}
