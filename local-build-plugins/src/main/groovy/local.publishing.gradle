plugins {
    id "maven-publish"
}

if ( !project.description ) {
    project.description = "The Hibernate ORM $project.name module"
}

var publishingExtension = project.getExtensions().getByType(PublishingExtension) as PublishingExtension

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Apply standard POM information for all publications

publishingExtension.publications.configureEach {
    pom {
        url = 'https://hibernate.org/orm'

        organization {
            name = 'Hibernate.org'
            url = 'https://hibernate.org'
        }

        licenses {
            license {
                name = 'Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                comments = 'See discussion at https://hibernate.org/community/license/ for more details.'
                distribution = 'repo'
            }
        }

        scm {
            url = 'https://github.com/hibernate/hibernate-orm'
            connection = 'scm:git:https://github.com/hibernate/hibernate-orm.git'
            developerConnection = 'scm:git:git@github.com:hibernate/hibernate-orm.git'
        }

        issueManagement {
            system = 'jira'
            url = 'https://hibernate.atlassian.net/browse/HHH'
        }

        developers {
            developer {
                id = 'hibernate-team'
                name = 'The Hibernate Development Team'
                organization = 'Hibernate.org'
                organizationUrl = 'https://hibernate.org'
            }
        }
    }
}

publishingExtension.repositories {
    maven {
        name = "staging"
        url = rootProject.layout.buildDirectory.dir("staging-deploy${File.separator}maven")
    }
    maven {
        name = 'snapshots'
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        // So that Gradle uses the `ORG_GRADLE_PROJECT_snapshotsPassword` / `ORG_GRADLE_PROJECT_snapshotsUsername`
        //  env variables to read the username/password for the `snapshots` repository publishing:
        credentials(PasswordCredentials)
    }
}

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// register the "main" publication named `publishedArtifacts`
publishingExtension.publications.register("publishedArtifacts", MavenPublication) {
    pom {
        name = "Hibernate ORM - ${project.name}"
    }
}
// The module build script sets `description` after applying this plugin, so read it once the
// project is evaluated; a provider closure over the project cannot be stored by the configuration cache.
project.afterEvaluate {
    def projectDescription = project.description
    publishingExtension.publications.named("publishedArtifacts", MavenPublication) {
        pom {
            description = projectDescription
        }
    }
}

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Ancillary tasks

tasks.register('showPublications') {
    doFirst {
        project.publishing.publications.each { publication ->
            println "Publication (${publication.name}): ${publication.groupId}:${publication.artifactId}:${publication.version}"
            publication.artifacts.each { artifact ->
                println "    > ${artifact}"
            }
        }
    }
}

// The `publication` and `repository` properties of the publish tasks are not available while the task
// executes when the configuration cache is used.  So the details to log are captured once the task graph is
// ready (when the properties are assigned) and the actions only use plain values (strings and files).
def publicationDetails = { publication ->
    [
            name      : publication.name,
            groupId   : publication.groupId,
            artifactId: publication.artifactId,
            packaging : publication.pom.packaging,
            artifacts : publication.artifacts.collect { [classifier: it.classifier, file: it.file] }
    ]
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { publishTask ->
        if ( !publishTask.project.is( project ) ) {
            return
        }
        if ( publishTask instanceof PublishToMavenLocal ) {
            def details = publicationDetails( publishTask.publication )
            publishTask.doFirst {
                def log = Logging.getLogger( PublishToMavenLocal )
                log.lifecycle( "PublishToMavenLocal ({})", details.name )
                log.lifecycle( "    - {} : {} : {} ", details.groupId, details.artifactId, details.packaging )
                log.lifecycle( "    - artifacts ({})...", details.artifacts.size() )
                details.artifacts.forEach {
                    log.lifecycle( "        - artifact ({}) : {} ({})", it.classifier, it.file, it.file.size() )
                }
            }
        }
        else if ( publishTask instanceof PublishToMavenRepository ) {
            def details = publicationDetails( publishTask.publication )
            def repositoryName = publishTask.repository.name
            publishTask.doFirst {
                def log = Logging.getLogger( PublishToMavenRepository )
                log.lifecycle( "PublishToMavenRepository ({} : {})", details.name, repositoryName )
                log.lifecycle( "    - {} : {} : {} ", details.groupId, details.artifactId, details.packaging )
                log.lifecycle( "    - artifacts ({})...", details.artifacts.size() )
                details.artifacts.forEach {
                    log.lifecycle( "        - artifact ({}) : {} ({})", it.classifier, it.file, it.file.size() )
                }
            }
        }
    }
}
